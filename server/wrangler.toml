# Il servizio di accesso di MyDiveLog.
#
# I segreti NON stanno qui: si caricano con `npx wrangler secret put NOME`, che
# li tiene fuori dal repository e fuori dalla cronologia dei comandi. Qui ci
# sono solo i valori che si possono leggere senza fare danni.
name = "mydivelog-accesso"
main = "worker.ts"
compatibility_date = "2026-08-01"
# ESPLICITO, e non lasciato al valore predefinito: l'applicazione chiama il
# Worker sul suo indirizzo `workers.dev`, che è quello scritto in
# `src/sync/configurazione.ts`. Aggiungendo una rotta di zona qui sotto è facile
# credere che il servizio si sia «spostato» sul dominio: non è così, la rotta
# serve solo al ritorno di Apple. Se questo diventasse `false`, l'accesso
# smetterebbe di funzionare per tutti.
workers_dev = true

[vars]
TURSO_ORG = "zinin"
TURSO_GROUP = "default"
# Gli identificativi dell'app presso i due fornitori: sono pubblici per
# costruzione — finiscono dentro ogni copia dell'applicazione.
#
# Separati da VIRGOLA, perché Google ne assegna uno per tipo di client: la
# registrazione «iOS» e quella «Desktop app» sono due, con due identificativi, e
# il token di ciascuna porta il proprio in `aud`. Con un valore solo l'accesso
# funziona su una piattaforma e viene rifiutato sull'altra.
#
# Apple, dal giorno di Sign in with Apple, ne ha due — e per lo stesso identico
# motivo di Google, cioè che sono due REGISTRAZIONI diverse:
#
#   it.ferrando.mydivelog           il bundle id, identifica l'app installata e
#                                   vale per il giro nativo (ASAuthorization);
#   it.ferrando.mydivelog.accesso   il Services ID, identifica il «servizio web»
#                                   e vale per il giro con il browser.
#
# Il token che Apple emette porta in `aud` quello del giro da cui è nato. Oggi si
# usa solo il giro web, quindi arriva sempre il secondo; il primo resta elencato
# perché il giro nativo è la cosa che si aggiunge un domani, e quel giorno non si
# deve scoprire questa riga con un 401 in mano.
APPLE_CLIENT_ID = "it.ferrando.mydivelog,it.ferrando.mydivelog.accesso"
# Quale dei due è il Services ID, cioè quello con cui si SCAMBIA il codice.
# Scritto per nome e non dedotto dalla posizione nell'elenco, come per Google.
APPLE_SERVICES_ID = "it.ferrando.mydivelog.accesso"
# Il Team ID: finisce in `iss` dentro il segreto del client.
APPLE_TEAM_ID = "73F4VR2CMU"
# L'identificativo della chiave `.p8`: finisce in `kid`, nell'intestazione del
# segreto. Non è la chiave — quella è un segreto e non sta qui:
#
#     npx wrangler secret put APPLE_CHIAVE_P8 < AuthKey_7MLL5X469B.p8
#
# Il segreto vero e proprio che Apple pretende è un JWT ES256 con scadenza al
# massimo semestrale, e lo firma il Worker AL VOLO a ogni richiesta, valido
# cinque minuti. Per questo qui non c'è nessuna data da ricordare.
APPLE_KEY_ID = "7MLL5X469B"
# Il Return URL registrato sul portale di Apple. Deve combaciare carattere per
# carattere con quello scritto là dentro, con quello che l'app mette nella
# richiesta di autorizzazione e con quello che si manda allo scambio: Apple
# ricontrolla tutti e tre, e una barra finale di differenza basta a farlo
# rifiutare.
#
# È il WORKER e non l'applicazione perché Apple, quando le si chiedono nome ed
# email, risponde con una POST invece che con un redirect — e una POST non si può
# mandare a `mydivelog://` né a una porta su `127.0.0.1`.
APPLE_RITORNO = "https://mydivelog.site/accesso-apple/ritorno"
GOOGLE_CLIENT_ID = "883995552043-2khev71oqkm7go3nilogqc82tunbito7.apps.googleusercontent.com,883995552043-fcsjcnlb5o6ih7af686bk0j7pls9k5bi.apps.googleusercontent.com"
# Quale dei due client di Google è quello «Desktop app»: è l'unico che ha un
# segreto, e Google lo pretende sullo scambio del codice anche con PKCE. Il
# segreto NON è qui: si carica con
#
#     npx wrangler secret put GOOGLE_SEGRETO_DESKTOP
#
# Scritto per nome e non dedotto dalla posizione nell'elenco qui sopra, perché
# «il secondo della lista» si rompe il giorno che qualcuno riordina una riga.
GOOGLE_CLIENT_DESKTOP = "883995552043-fcsjcnlb5o6ih7af686bk0j7pls9k5bi.apps.googleusercontent.com"
# Vuoto = qualunque origine. Da restringere quando si sa da dove arriva l'app.
ORIGINI_AMMESSE = ""

# Dove finiscono le segnalazioni dal modulo del sito.
#
# ► QUESTO È L'ARCHIVIO. IL FOGLIO DI GOOGLE È UNA COPIA. ◄ Il modulo del sito
# scrive qui passando dalla rotta `/segnalazione`, e solo dopo il Worker manda
# una copia al foglio. L'ordine non è
# indifferente: così un guasto di Google costa una copia mancata, non una
# segnalazione persa — la riga resta con `foglio: false` e
# `scripts/travasa-segnalazioni.mjs` la riprende.
#
# PERCHÉ NON SI SCRIVE NEL FOGLIO E BASTA. Perché allora la sorte di quello che
# qualcuno si è preso la briga di scrivere dipenderebbe da un servizio di terzi,
# proprio nel momento in cui nessuno sta guardando. E perché l'indirizzo dello
# script che scrive nel foglio è pubblico per costruzione: quello che lo protegge
# è il gettone in `FOGLIO_GETTONE`, non la segretezza dell'indirizzo.
#
# ► QUI C'ERA SCRITTO «vedi la rotta /segnalazioni.csv in worker.ts», E QUELLA
# ROTTA NON È MAI ESISTITA. ◄ Per settimane le segnalazioni sono entrate qui
# dentro e non è uscito niente: da fuori era indistinguibile da un modulo rotto.
# Una riga di commento che rimanda a codice che non c'è è peggio di nessuna riga,
# perché chiude la domanda invece di lasciarla aperta —
# `tests/rotteDichiarate.test.ts` adesso confronta le rotte nominate in questo
# file con quelle che `worker.ts` ha davvero.
#
# ► LE SEGNALAZIONI NON SI CANCELLANO DA SOLE. ◄ Niente scadenza: una
# segnalazione che sparisce dopo un mese è una segnalazione persa, e chi l'ha
# scritta non lo saprà mai.

[[kv_namespaces]]
binding = "SEGNALAZIONI"
id = "4a843935b6094e6bb70d9086ffeaffbd"

# Il contatore del limite di frequenza.
#
# PERCHÉ NON IL LEGAME NATIVO `[[ratelimits]]`. C'era, si configurava in tre
# righe, ed è stato provato: con un tetto dichiarato di 10 richieste al minuto,
# trentatré richieste dallo stesso indirizzo nello stesso minuto sono passate
# tutte. Non è un difetto nascosto — la documentazione di Cloudflare dice che
# quell'API è «permissiva, coerente col tempo, e volutamente non pensata come
# sistema di conteggio accurato», perché i contatori stanno nella cache della
# macchina e si aggiornano in modo asincrono. Per contare le visite va bene; per
# difendere una rotta che chiama Google e crea database, no.
#
# Un Durable Object per chiave: Cloudflare garantisce una sola istanza al mondo e
# le richieste in fila, quindi il conteggio è esatto per costruzione. Il legame è
# disponibile anche sul piano gratuito.
#
# `new_sqlite_classes` e non `new_classes`: sul piano gratuito gli oggetti
# devono essere di quel tipo. Questo non usa nessun archivio — il contatore vive
# in memoria — ma la classe va comunque dichiarata così.

[[durable_objects.bindings]]
name = "LIMITI"
class_name = "LimiteFrequenza"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimiteFrequenza"]

# La rotta di zona che porta il ritorno di Apple a questo Worker.
#
# PERCHÉ SERVE. Il Worker vive per conto suo su `mydivelog-accesso.mydivelog.workers.dev`,
# e l'app lo chiama lì. Il Return URL di Apple però non può stare su un dominio
# `workers.dev`: sul portale si registra un dominio verificato, ed è
# `mydivelog.site`. Questa rotta è il pezzo che collega i due — «tutto ciò che
# arriva su `mydivelog.site/accesso-apple/…` lo gestisce questo Worker» — e senza
# di essa la POST di Apple finisce sul sito statico, che risponde 404 e
# l'accesso resta appeso senza dire niente.
#
# `zone_name` e non `zone_id`: il nome si legge, l'identificativo va copiato dal
# pannello e non dice a chi legge di quale dominio si tratti.
[[routes]]
pattern = "mydivelog.site/accesso-apple/*"
zone_name = "mydivelog.site"
