# Windows, Android e Linux: le tre piattaforme che non si costruiscono su un Mac.
#
# PERCHÉ UN WORKFLOW SEPARATO DA `ci.yml`. Quello è la guardia: gira a ogni
# push, dev'essere veloce e dev'essere verde, perché una spunta rossa lì
# significa «è appena cambiato qualcosa». Questo costruisce pacchetti per due
# piattaforme che nessuno qui possiede: è normale che sia lento, ed è possibile
# che ogni tanto sia rosso. Tenerli insieme farebbe esattamente il danno che
# `ci.yml` evita — abituare a ignorare il rosso.
#
# ► QUESTE BUILD QUASI NESSUNO LE HA PROVATE, E «QUASI» È NUOVO. ◄ Non c'è un
# PC e non c'è un telefono Android in questa casa. `src/core` è lo stesso codice
# che gira sul Mac e sull'iPhone, con milleseicento test dietro, ma il giro
# completo — finestra, Bluetooth, archivio, stampa — su Windows e Android non
# l'ha fatto nessuno. Il sito lo dice, e va continuato a dirlo finché resta
# vero.
#
# **E il 29 agosto 2026 quella frase ha dimostrato di avere i denti**: l'APK non
# era firmato affatto, quindi non si installava, e per settimane il pulsante del
# sito ha consegnato un file inservibile senza che un solo comando fallisse.
#
# **Linux è l'eccezione, ed è il motivo per cui è entrata.** A differenza di
# Windows e Android, quella build è stata **costruita e fatta partire davvero**
# prima di essere aggiunta qui: finestra disegnata, navigazione che risponde ai
# click, archivio SQLite creato con le sue quattro tabelle, libdivecomputer
# dentro il binario. Quello che resta non provato è **solo il Bluetooth**, che
# vuole un adattatore. *La differenza fra «dichiarata» e «provata, meno una
# cosa» è tutta qui, e vale la pena tenerla scritta.*

name: Windows, Android e Linux

on:
  workflow_dispatch:
    inputs:
      versione:
        description: 'Numero da scrivere nel nome dei file (es. 1.6.3)'
        type: string
        required: true
jobs:
  # ------------------------------------------------------------------ Windows
  #
  # ► WINDOWS ADESSO HA libdivecomputer, e ci è arrivato da un'altra strada. ◄
  #
  # Il primo tentativo era MSYS2 e gcc, e produceva un archivio con l'ABI di
  # mingw da mettere accanto a un binario Rust con quella di MSVC. Non è stato
  # nemmeno provato fino in fondo: si sarebbe legato, sarebbe partito, e sarebbe
  # caduto dentro una malloc su una macchina che non abbiamo per capire dove.
  #
  # La strada buona era togliere autotools di mezzo: `build.rs` legge la lista
  # dei file da `src/Makefile.am`, si scrive `config.h` da sé e compila con la
  # cassa `cc`, che su Windows usa `cl.exe` — stesso compilatore, stessa ABI,
  # stesso runtime C del resto del binario. Vedi `compila_con_cc` in `build.rs`.
  #
  # QUELLA STRADA È STATA VERIFICATA PRIMA DI ARRIVARE QUI, e non su Windows:
  # sul Mac, dove le due librerie — quella di `configure` e quella di `cc` — si
  # possono mettere una accanto all'altra. Stessi 356 descrittori, e le stesse
  # 85 immersioni vere decodificate campione per campione, 64.706 in tutto, con
  # lo stesso hash. Su Windows resta un'incognita sola: il compilatore.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # `--bundles nsis`: la configurazione dice `dmg` e `app`, che su Windows non
      # esistono. NSIS fa un installatore singolo, che è quello che serve a chi
      # scarica da un sito; l'MSI chiede privilegi e spaventa.
      #
      # Niente `--no-default-features`: libdivecomputer si compila anche qui.
      - name: Costruisci
        run: npx tauri build --bundles nsis

      - name: Raccogli
        shell: pwsh
        run: |
          New-Item -ItemType Directory consegna | Out-Null
          # I NOMI NON PORTANO IL NUMERO DI VERSIONE, ed è voluto: il pulsante
          # del sito punta a `releases/latest/download/<nome>`, che vale solo se
          # il nome resta lo stesso a ogni pubblicazione. NSIS invece il numero
          # ce lo mette, quindi si rinomina qui.
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1 |
            Copy-Item -Destination consegna/MyDiveLog-Windows-setup.exe
          Copy-Item src-tauri/target/release/MyDiveLog.exe consegna/MyDiveLog-Windows-portatile.exe
          # Le impronte servono a chi scarica: un binario non firmato non dice
          # da dove viene, e questo è l'unico modo che ha per verificarlo.
          #
          # L'elenco si materializza in una variabile PRIMA di scrivere, o
          # PowerShell ci infila dentro anche SHA256.txt mentre lo sta creando e
          # muore su un file occupato da se stesso.
          $file = @(Get-ChildItem consegna -File)
          $file | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii consegna/SHA256.txt
          Get-Content consegna/SHA256.txt

      - uses: actions/upload-artifact@v6
        with:
          name: MyDiveLog-${{ inputs.versione }}-Windows
          path: consegna/
          if-no-files-found: error

  # ------------------------------------------------------------------ Android
  #
  # ANDROID INVECE CE L'HA, libdivecomputer: `build.rs` sa incrociare con l'NDK
  # dall'agosto 2026, e il wrapper clang dell'NDK è una catena coerente — niente
  # ABI mescolate come su Windows.
  #
  # ► LA FIRMA HA DUE MODI, E QUALE DEI DUE SI USA LO DECIDONO I SEGRETI. ◄
  #
  # Fino al 29 agosto 2026 ce n'era uno solo: la chiave la generava questo
  # workflow a ogni giro, con la password scritta qui in chiaro — non un segreto
  # trapelato, un segreto che non c'era. Per un APK che si scarica dal sito va
  # bene, ed è dichiarato: quella firma NON garantisce da chi viene il file,
  # perché chiunque può rifarne una uguale, e a garantire l'origine è l'impronta
  # SHA-256 pubblicata accanto.
  #
  # Su Google Play quel modo non regge, e non per severità: **la prima consegna
  # registra la chiave di caricamento, e ogni consegna successiva firmata con
  # una chiave diversa viene rifiutata.** Una chiave nuova a ogni build vuol
  # dire una consegna sola in tutta la vita dell'app.
  #
  # Quindi: se i tre segreti ci sono, si firma con la chiave del proprietario e
  # si costruisce ANCHE l'`.aab` per Play; se non ci sono, si ricade nel modo
  # vecchio e si costruisce il solo APK. La ricaduta non è pigrizia — questo
  # repository è pubblico, e chi lo clona senza segreti deve poterlo costruire
  # lo stesso. **Il passo «Come si è firmato» stampa quale dei due è successo**:
  # un workflow che ricade in silenzio produrrebbe un APK inservibile per Play
  # con la stessa faccia verde di uno buono.
  #
  # I segreti, da creare in Settings → Secrets and variables → Actions:
  #   ANDROID_KEYSTORE_BASE64    il file .jks passato per `base64`
  #   ANDROID_KEYSTORE_PASSWORD  la password (store e chiave devono coincidere,
  #                              vedi sotto)
  #   ANDROID_KEY_ALIAS          l'alias dentro il keystore
  #
  # ► IL KEYSTORE VA GENERATO CON `-storepass` E `-keypass` UGUALI. ◄ Il file
  # `keystore.properties` che Tauri legge ha UNA sola voce `password`, e la usa
  # per tutte e due. Con due password diverse la firma fallisce dentro gradle,
  # e il messaggio non nomina questa causa.
  #
  # ► E IL KEYSTORE NON SI PERDE. ◄ Se `ANDROID_KEYSTORE_BASE64` va perso e Play
  # ha registrato quella chiave come chiave di caricamento, si ricomincia da una
  # richiesta a Google: non è una cosa che si rigenera come una password.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # La versione dell'NDK è fissata. Un NDK che cambia sotto i piedi è il
      # modo classico per avere una build che ieri passava e oggi no, con in
      # mezzo nessuna riga di codice cambiata.
      - name: NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Solo arm64: è quello che hanno tutti i telefoni in circolazione da anni.
      # Le altre tre architetture triplicherebbero tempo e peso per coprire
      # apparecchi che chi installa un APK a mano non ha.
      - run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Prepara il progetto Android
        run: npx tauri android init --ci

      # La chiave. Quale dei due modi si usa lo decidono i segreti: vedi il
      # commento in testa al job.
      - name: Chiave di firma
        env:
          CHIAVE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CHIAVE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHIAVE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          if [ -n "${CHIAVE_BASE64}" ] && [ -n "${CHIAVE_PASSWORD}" ] && [ -n "${CHIAVE_ALIAS}" ]; then
            printf '%s' "${CHIAVE_BASE64}" | base64 -d > "$RUNNER_TEMP/chiave.jks"
            ALIAS="${CHIAVE_ALIAS}"
            PASS="${CHIAVE_PASSWORD}"
            echo "PER_PLAY=1" >> "$GITHUB_ENV"
          else
            # Modo vecchio: chiave usa-e-getta, password in chiaro. Vedi sopra.
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/chiave.jks" \
              -alias mydivelog -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass mydivelog -keypass mydivelog \
              -dname "CN=MyDiveLog, O=MyDiveLog, C=IT"
            ALIAS=mydivelog
            PASS=mydivelog
            echo "PER_PLAY=0" >> "$GITHUB_ENV"
          fi
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/chiave.jks
          keyAlias=$ALIAS
          password=$PASS
          PROPS

      # ► SENZA QUESTO PASSO IL PACCHETTO ESCE NON FIRMATO. ◄ Il
      # `build.gradle.kts` che Tauri genera non contiene nessuna configurazione
      # di firma: `keystore.properties` esiste e non lo legge nessuno. È così
      # che gli APK pubblicati fino al 29 agosto 2026 sono usciti **senza
      # nessuna firma**, senza che un solo comando fallisse — e Android un APK
      # non firmato si rifiuta di installarlo. Il racconto sta in testa a
      # `scripts/firma-progetto-android.mjs`.
      - name: Configura la firma nel progetto generato
        run: node scripts/firma-progetto-android.mjs

      # Il workflow deve DIRE quale dei due modi ha usato. Una ricaduta
      # silenziosa nel modo usa-e-getta darebbe un pacchetto che Play rifiuta,
      # con la stessa spunta verde di uno buono.
      - name: Come si è firmato
        run: |
          if [ "$PER_PLAY" = "1" ]; then
            echo "::notice::Firmato con la chiave del proprietario. Si costruisce anche l'.aab per Google Play."
          else
            echo "::warning::Nessun segreto di firma: chiave usa-e-getta, password in chiaro. Si costruisce il solo APK, e NON è caricabile su Google Play."
          fi

      # `--apk --aab` in una chiamata sola: la parte cara è compilare Rust e la
      # libreria C, e si paga una volta per tutte e due i pacchetti.
      - name: Costruisci
        run: |
          set -eu
          if [ "$PER_PLAY" = "1" ]; then
            npx tauri android build --apk --aab --target aarch64
          else
            npx tauri android build --apk --target aarch64
          fi

      # Cosa dichiara di sé il pacchetto generato, letto e non dedotto. Il
      # livello di API bersaglio è un cancello di Google Play — lo alzano ogni
      # anno — e nessuno qui lo ha mai guardato: questo passo lo mette nel log,
      # così la prossima volta è un fatto e non una supposizione.
      - name: Cosa dichiara il progetto Android
        run: |
          echo '--- build.gradle.kts ---'
          grep -nE 'minSdk|targetSdk|compileSdk|versionCode|versionName|applicationId|namespace' \
            src-tauri/gen/android/app/build.gradle.kts || true
          echo '--- pacchetti prodotti ---'
          find src-tauri/gen/android -name '*.apk' -o -name '*.aab' | sort

      # ► SI GUARDA DENTRO IL PACCHETTO, NON SI CREDE AL COMANDO. ◄ È il
      # controllo che mancava, ed è il motivo per cui il difetto è durato
      # settimane: `tauri android build` finiva con esito zero, l'artefatto
      # c'era e pesava dieci megabyte, e dentro non c'era nessuna firma. Un
      # esito zero dice che il comando non è morto, non che abbia fatto quello
      # che doveva.
      - name: Il pacchetto è davvero firmato?
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile

          guai = []

          # ► SOLO `build/outputs/`. ◄ La prima versione guardava sotto tutto
          # `gen/android`, e il 29 agosto 2026 si è accesa su
          # `build/intermediates/.../intermediary-bundle.aab` — un file di
          # passaggio di gradle, che non è firmato perché non deve esserlo. I due
          # pacchetti veri erano firmati benissimo. *Una guardia che si accende
          # su una cosa che va bene insegna a spegnerla*, ed è la stessa lezione
          # già pagata due volte qui: su `@garmin/fitsdk` e dentro «thrust».
          #
          # Restringere una ricerca però ha il rischio gemello: se il percorso
          # cambia, non trova più niente e **passa a vuoto**. Per questo sotto si
          # conta quello che si è guardato, e zero è un errore.
          apk_trovati = 0
          aab_trovati = 0

          for apk in glob.glob('src-tauri/gen/android/app/build/outputs/**/*.apk', recursive=True):
              apk_trovati += 1
              d = open(apk, 'rb').read()
              # La firma v2/v3 vive in un blocco fra il contenuto e la directory
              # centrale dello zip, marcato da questa stringa. La v1 invece sta
              # come voci META-INF/*.RSA dentro lo zip: se ne basta una delle due.
              v2 = d.rfind(b'APK Sig Block 42') >= 0
              v1 = any(
                  n.upper().startswith('META-INF/') and n.upper().endswith(('.RSA', '.DSA', '.EC'))
                  for n in zipfile.ZipFile(apk).namelist()
              )
              print(f'{apk}: v1={v1} v2/v3={v2}')
              if not (v1 or v2):
                  guai.append(f'{apk} NON è firmato')

          for aab in glob.glob('src-tauri/gen/android/app/build/outputs/**/*.aab', recursive=True):
              aab_trovati += 1
              # Un .aab è firmato alla maniera dei jar: voci META-INF/*.RSA.
              nomi = zipfile.ZipFile(aab).namelist()
              v1 = any(
                  n.upper().startswith('META-INF/') and n.upper().endswith(('.RSA', '.DSA', '.EC'))
                  for n in nomi
              )
              print(f'{aab}: v1={v1}')
              if not v1:
                  guai.append(f'{aab} NON è firmato: Google Play lo rifiuta')

          # Zero file guardati non è «tutto a posto»: è la guardia che non ha
          # guardato niente, che è il modo in cui una prova diventa verde per il
          # motivo sbagliato.
          if apk_trovati == 0:
              guai.append('nessun .apk sotto build/outputs: il controllo non ha guardato niente')
          import os
          if os.environ.get('PER_PLAY') == '1' and aab_trovati == 0:
              guai.append('nessun .aab sotto build/outputs, ma si stava costruendo per Play')

          if guai:
              print('\n'.join('::error::' + g for g in guai))
              sys.exit(1)
          print(f'firmati: {apk_trovati} apk, {aab_trovati} aab.')
          PY

      - name: Raccogli
        run: |
          set -eu
          mkdir consegna
          # Solo `build/outputs`: vedi il passo della firma. Cercando in tutto
          # `gen/android` si raccoglie anche quello che gradle si tiene per sé.
          find src-tauri/gen/android/app/build/outputs -name '*.apk' -exec cp {} consegna/ \;
          cd consegna
          # Nome senza numero di versione: vedi il commento gemello nel job
          # Windows. Il collegamento del sito dev'essere sempre lo stesso.
          for f in *.apk; do mv "$f" MyDiveLog-Android-arm64.apk; break; done
          sha256sum * > SHA256.txt
          cat SHA256.txt

      # L'`.aab` sta in una cartella SUA, e non entra nella release di GitHub.
      # È la stessa regola del `.pkg` del Mac App Store: un pacchetto firmato
      # per un negozio, allegato a una release, dà a chi lo scarica un file che
      # non si installa — un difetto autoinflitto. Il nome porta il numero di
      # versione perché questo file lo si carica a mano su Play, dove sapere
      # quale versione si sta consegnando è tutto.
      - name: Raccogli l'.aab per Google Play
        if: env.PER_PLAY == '1'
        run: |
          set -eu
          mkdir per-play
          # ► SOLO `build/outputs`, E POI SI CONTA. ◄ La prima versione cercava
          # in tutto `gen/android` e si portava dietro anche
          # `build/intermediates/.../intermediary-bundle.aab`: trenta megabyte di
          # file di passaggio, non firmato, dentro l'artefatto da caricare su
          # Play accanto a quello giusto. Due `.aab` in una cartella che ne deve
          # contenere uno sono un invito a caricare quello sbagliato.
          find src-tauri/gen/android/app/build/outputs -name '*.aab' -exec cp {} per-play/ \;
          cd per-play
          quanti=$(ls -1 *.aab | wc -l | tr -d ' ')
          if [ "$quanti" != "1" ]; then
            echo "::error::$quanti file .aab invece di uno: non si tira a indovinare quale caricare"
            ls -la
            exit 1
          fi
          for f in *.aab; do mv "$f" "MyDiveLog-${{ inputs.versione }}-play.aab"; break; done
          sha256sum * > SHA256.txt
          cat SHA256.txt

      - uses: actions/upload-artifact@v6
        with:
          name: MyDiveLog-${{ inputs.versione }}-Android
          path: consegna/
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: env.PER_PLAY == '1'
        with:
          name: MyDiveLog-${{ inputs.versione }}-Android-Play
          path: per-play/
          if-no-files-found: error

  # ------------------------------------------------------------------- Linux
  #
  # ► PERCHÉ LINUX È IL CASO FACILE, E DOVE INVECE NON LO È. ◄
  #
  # libdivecomputer qui si compila per la strada normale: c'è una shell, quindi
  # `./configure` gira e basta — niente della ginnastica che su Windows è
  # costata la riscrittura con la cassa `cc` per non mescolare l'ABI di mingw
  # con quella di MSVC. È la piattaforma su cui quella libreria costa meno.
  #
  # Il difficile sta altrove, e non è nostro: **WebKitGTK**. Il pacchetto che
  # esce da qui dipende da `libwebkit2gtk-4.1-0`, che c'è da Ubuntu 24.04 e
  # Debian 13 in su; su Ubuntu 22.04 esiste la 4.0 e questo `.deb` non si
  # installa. Un pacchetto non copre le distribuzioni, e il sito lo deve dire
  # prima del pulsante — come già fa per il Mac Apple Silicon.
  #
  # ► E L'AGGIORNATORE NON C'È, PER SCELTA. ◄ L'aggiornatore di Tauri su Linux
  # funziona con l'AppImage, non col `.deb`. Lasciarlo acceso darebbe un
  # pulsante «cerca aggiornamenti» che risponde
  # «None of the fallback platforms ["linux-x86_64"] were found…» — misurato,
  # non supposto. **È esattamente il difetto già chiuso per il Mac App Store**:
  # un pulsante che non fa niente è peggio di nessun pulsante, e un messaggio
  # grezzo di una libreria dato a una persona è la stessa specie di guasto che
  # il primo utente esterno ha incontrato col Bluetooth.
  #
  # Si spegne con i due interruttori insieme, come là: la feature Rust
  # `senza-aggiornamenti` toglie il plugin dalla compilazione, e
  # `createUpdaterArtifacts: false` — in `src-tauri/tauri.linux.conf.json` —
  # toglie l'artefatto dal confezionamento. Muoverne uno solo non dà un
  # pacchetto sbagliato: non dà nessun pacchetto.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Le librerie di sistema che Tauri vuole su Linux. `libwebkit2gtk-4.1-dev`
      # è quella che decide su quali distribuzioni girerà il pacchetto.
      - name: Librerie di sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # I due interruttori dell'aggiornatore, insieme: vedi il commento sopra.
      # `--bundles deb` e non AppImage: è quello che la gente si aspetta di
      # scaricare, e l'AppImage senza aggiornatore non porterebbe nessun
      # vantaggio in cambio del suo peso.
      - name: Costruisci
        env:
          VITE_SENZA_AGGIORNAMENTI: '1'
        run: npx tauri build --features senza-aggiornamenti --bundles deb

      # Si guarda dentro il pacchetto, come su Android. Qui la domanda non è la
      # firma — su Linux non se ne firma nessuna — ma **che l'aggiornatore non
      # ci sia davvero**: se un giorno qualcuno muove uno dei due interruttori e
      # non l'altro, il pacchetto esce con dentro un aggiornatore che non può
      # funzionare, e nessun comando lo segnala.
      - name: L'aggiornatore è davvero fuori?
        run: |
          set -eu
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          echo "pacchetto: $DEB"
          rm -rf /tmp/dentro && mkdir -p /tmp/dentro
          dpkg-deb -x "$DEB" /tmp/dentro
          BIN=$(find /tmp/dentro -type f -name 'mydivelog' | head -1)
          echo "binario: $BIN"
          # ► SI CERCA IL PLUGIN, NON IL SUO INDIRIZZO. ◄ La prima versione di
          # questo controllo cercava `releases/latest/download/latest.json` e ha
          # fermato la build subito — sbagliando: quella stringa è la
          # CONFIGURAZIONE incorporata nel binario, e c'è comunque, che
          # l'aggiornatore sia compilato dentro o no. *Cercare un indirizzo non
          # dice se il codice che lo userebbe c'è.*
          #
          # I due marcatori qui sotto sono stati misurati nei due sensi, sullo
          # stesso progetto compilato due volte: assenti con la feature
          # `senza-aggiornamenti`, presenti senza. È l'unico modo di sapere che
          # una guardia sa diventare rossa.
          for AGO in 'tauri_plugin_updater' 'None of the fallback platforms'; do
            if strings "$BIN" | grep -qF "$AGO"; then
              echo "::error::l'aggiornatore è dentro il binario (trovato: $AGO): uno dei due interruttori non è stato mosso"
              exit 1
            fi
          done
          echo "nessuna traccia dell'aggiornatore nel binario." 
          # E libdivecomputer invece ci deve essere: è metà del catalogo.
          if ! strings "$BIN" | grep -q 'dc_custom_open'; then
            echo "::error::libdivecomputer non è nel binario: il catalogo si ridurrebbe ai due driver di casa"
            exit 1
          fi
          echo "libdivecomputer c'è."
          echo '--- dipendenze dichiarate dal pacchetto ---'
          dpkg-deb -f "$DEB" Depends Version Architecture Installed-Size

      - name: Raccogli
        run: |
          set -eu
          mkdir consegna
          # Nome senza numero di versione: vedi il commento gemello nel job
          # Windows. Il collegamento del sito dev'essere sempre lo stesso.
          find src-tauri/target/release/bundle/deb -name '*.deb' \
            -exec cp {} consegna/MyDiveLog-Linux-amd64.deb \;
          cd consegna
          sha256sum * > SHA256.txt
          cat SHA256.txt

      - uses: actions/upload-artifact@v6
        with:
          name: MyDiveLog-${{ inputs.versione }}-Linux
          path: consegna/
          if-no-files-found: error
