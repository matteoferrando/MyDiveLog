# Controlli automatici a ogni push.
#
# Girano le stesse tre cose che giro io prima di consegnare — typecheck, test,
# build — perché il valore di un controllo automatico è esattamente che nessuno
# debba ricordarsene. La suite gira anche sotto due fusi orari agli antipodi
# (Kiritimati è UTC+14, Midway UTC-11): le immersioni portano date e la metà dei
# bug di data si vede solo se l'orologio della macchina non è quello europeo.

name: Controlli

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` e non `npm install`: installa esattamente quello che dice il
      # lock, quindi un test che passa qui passa anche sul Mac.
      - run: npm ci

      - name: Tipi
        run: npm run typecheck

      # Il formato entra QUI e il lint no, ed è una scelta.
      #
      # `format:check` diventa verde subito dopo il primo `npm run format`;
      # `npm run lint` esce ancora 1 per dodici errori storici. Un controllo che
      # nasce rosso e resta rosso insegna a ignorare la spunta, e da quel momento
      # anche il rosso vero non lo guarda più nessuno. Si aggiungono man mano che
      # passano, così una spunta rossa significa sempre «è appena cambiato
      # qualcosa».
      - name: Formato
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test con fusi orari estremi
        run: npm run test:tz

      - name: Build
        run: npm run build
