[package]
name = "mydivelog"
version = "0.1.0"
description = "Logbook subacqueo multi-computer"
authors = ["Matteo Ferrando"]
edition = "2021"
rust-version = "1.77.2"

# Il binario e la libreria: la libreria serve al target iOS, dove Tauri
# compila l'app come libreria statica linkata dal progetto Xcode.
[lib]
name = "mydivelog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Attivato automaticamente da `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
