[package]
name = "mydivelog"
version = "1.8.27"
description = "Logbook subacqueo multi-computer"
authors = ["Matteo Ferrando"]
edition = "2021"
rust-version = "1.77.2"

# Il binario e la libreria: la libreria serve al target iOS, dove Tauri
# compila l'app come libreria statica linkata dal progetto Xcode.
[lib]
name = "mydivelog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Il compilatore C, per la strada che salta autotools.
#
# Serve SOLO su Windows, dove `./configure` non gira: `cc` sceglie il
# compilatore giusto del bersaglio (là `cl.exe` di MSVC) e gli dà in pasto i file
# uno per uno. Vedi il commento lungo in `build.rs`, sopra `compila_con_cc`.
cc = { version = "1", optional = true }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# La transazione vera, che il plugin non sa fare.
#
# ► PERCHÉ SQLX COMPARE QUI, visto che è già nell'albero. ◄ Perché `src/archivio.rs`
# deve NOMINARE i suoi tipi: prende il `Pool<Sqlite>` che `tauri-plugin-sql`
# tiene nel suo stato, ne acquisisce una connessione e ci apre sopra una
# transazione. Senza questa riga quei tipi non hanno un nome in questo crate.
#
# La versione è la stessa che il plugin si porta dietro, e non è un caso: due
# copie di SQLx nel grafo darebbero due tipi `Pool<Sqlite>` diversi, e il pool
# preso dal plugin non entrerebbe nella nostra funzione. `Cargo.lock` dice
# 0.8.6 da tutte e due le parti.
#
# `default-features = false` perché di SQLx qui serve una fetta sola —
# l'adattatore SQLite e il runtime asincrono, che sono esattamente quelli che il
# plugin accende già.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# Il Bluetooth verso i computer subacquei.
#
# Non ha feature per bersaglio: il crate sceglie da sé CoreBluetooth su Apple,
# BlueZ su Linux, WinRT su Windows. Su una piattaforma dove lo stack non c'è
# `try_init` restituisce un errore invece di far cadere l'applicazione, e il
# lato TypeScript lo dichiara.
tauri-plugin-blec = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Gli UUID dei servizi e delle caratteristiche BLE.
#
# Dipendenza OPZIONALE, accesa solo da `computer-esterni`: serve unicamente al
# ponte verso libdivecomputer, che è l'unico posto del progetto in cui si
# chiamano `send_data` e `subscribe` del plugin — e quelle vogliono un `Uuid`,
# non una stringa. Il plugin non riesporta il tipo, quindi la cassa va nominata
# qui. La versione è la stessa che `tauri-plugin-blec` già si porta dietro, così
# non ne compaiono due copie nel grafo.
uuid = { version = "1", optional = true }

# Aprire un indirizzo nel browser di SISTEMA, non in una finestra nostra.
# Serve all'accesso con Google: una pagina di login disegnata dentro
# l'applicazione è indistinguibile da una finta, perché chi la guarda non può
# vedere né il dominio né il lucchetto.
tauri-plugin-opener = "2"

# Il portachiavi di sistema, solo dove esiste davvero.
#
# Dipendenza per bersaglio e non globale: `keyring` sceglie il backend con le
# feature, e attivare quella di Linux su macOS trascinerebbe dentro dbus e
# secret-service — roba che su un Mac non c'è e che farebbe fallire la build.
# Sugli altri sistemi il modulo non viene compilato affatto e l'interfaccia
# ripiega sull'archivio locale, dichiarandolo.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# L'aggiornamento automatico, e il riavvio che lo conclude. SUI COMPUTER, NON
# SUI TELEFONI.
#
# Non è una svista che manchino iOS e Android: su iPhone gli aggiornamenti li
# distribuisce l'App Store, e un'applicazione che se li scarica per conto suo
# verrebbe rifiutata alla revisione; su Android un APK non si installa da solo
# senza chiedere un permesso che spaventa più di quanto serva.
#
# Windows invece ci sta, e prima non c'era: la condizione diceva `macos` quando
# macOS era l'unico computer su cui girassimo, ed è rimasta lì per inerzia
# quando è arrivato Windows. Il risultato sarebbe stato che chi installa
# l'applicazione su un PC non scopre MAI che ne è uscita una nuova.
#
# Dipendenza per bersaglio significa anche che sui telefoni questi due crate non
# vengono nemmeno compilati — e che il permesso corrispondente deve stare in
# `capabilities/aggiornamento.json`, che dichiara le sue piattaforme, e non in
# `default.json`, o la build iOS fallisce con «permission not found».
#
# `process` serve a una riga sola: dopo aver installato l'aggiornamento
# l'applicazione va riavviata, e senza questo plugin l'unico modo sarebbe
# chiederlo a chi guarda.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Il ritorno dall'accesso su iOS.
#
# Sul Mac si usa un ascoltatore su `127.0.0.1`, che è la strada raccomandata per
# le applicazioni desktop e non lascia in giro nessuna associazione permanente.
# Su iPhone quella porta non si può aprire, quindi il ritorno passa da uno
# schema URL dichiarato in `Info.ios.plist`.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-deep-link = "2"
# Per chiamare `UIApplication.setIdleTimerDisabled:` — vedi `schermo.rs`. La
# strada del web (`navigator.wakeLock`) non esiste dentro una WKWebView, e su
# iOS uno schermo che si spegne sospende l'applicazione: le notifiche Bluetooth
# smettono di arrivare e lo scarico muore. `objc2` è già nell'albero (lo usa
# wry), quindi questa dipendenza non aggiunge codice da compilare.
objc2 = "0.6"

# ► SOLO SU ANDROID: CHIEDERE DOVE SALVARE, E SAPERCI SCRIVERE. ◄
#
# Il 16 settembre 2026, da un Samsung: *«il pdf non si genera ancora anche se è
# cambiato il messaggio. Forse perché si genera in una cartella che non risulta
# visibile se non da pc.»* Aveva ragione: su Android `document_dir()` è
# `getExternalFilesDir(DIRECTORY_DOCUMENTS)`, dentro `Android/data/<pacchetto>`,
# dove da Android 11 nessun gestore di file può entrare e che la disinstallazione
# porta via. Il file c'era e non era raggiungibile.
#
# `dialog` apre il selettore di sistema — `ACTION_CREATE_DOCUMENT`, lo Storage
# Access Framework — che è l'unico modo con cui un'applicazione senza permessi
# speciali scrive in una cartella dell'utente. `fs` serve a una funzione sola:
# quel selettore restituisce un `content://…` e non un percorso, e il
# descrittore per scriverci lo si chiede ad Android tramite `app.fs().open()`.
#
# ► PER BERSAGLIO, E NON GLOBALI. ◄ Sui computer il download del browser
# funziona e su iPhone la cartella Documenti compare già nell'app File: là
# questi due crate non servono e non vengono compilati. Il `dialog`, in
# particolare, sul desktop si tirerebbe dietro `rfd` e le finestre native di
# sistema — codice che non ha nessuna ragione di stare in questo binario.
#
# Nessuno dei due è raggiungibile dall'interfaccia: si usano da `scrivi_fuori`
# in `lib.rs`, e nessuna capacità in `capabilities/` concede i loro permessi
# alla WebView.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
# Attivato automaticamente da `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

# ► ACCESA, DAL 25 AGOSTO 2026. ◄
#
# `computer-esterni` entra in ogni build, pacchetti pubblicati compresi. Prima
# era spenta di sua iniziativa, e le ragioni erano due.
#
# LA LICENZA. libdivecomputer è LGPL-2.1: un programma MIT la può usare purché
# chi lo riceve possa ricompilare la libreria e rimetterla al suo posto. Dentro
# un binario firmato da Apple nessuno può rilinkare niente. La posizione che
# regge — e che il manutentore della libreria condivide — è che per
# un'applicazione OPEN SOURCE la condizione è comunque soddisfatta: chi riceve
# il programma può ricostruire *tutto*, libreria compresa, dal sorgente. Perché
# questo resti vero servono due cose, e vanno difese:
#
#   · il sorgente dell'applicazione resta pubblico;
#   · il tarball in `vendor/` resta versionato e resta QUELLO da cui si compila.
#     Sostituirlo con un sottomodulo o con un download in fase di build
#     toglierebbe a chi riceve il binario la possibilità di rifarlo identico, ed
#     è esattamente la proprietà su cui poggia tutto il ragionamento.
#
# ► IL PRIMO APPARECCHIO VERO È ESISTITO: 17 SETTEMBRE 2026, MARES QUAD CI. ◄
#
# Fino a ieri qui c'era scritto: «nessun computer subacqueo di terzi è mai stato
# collegato a questo codice… il primo apparecchio vero non è ancora esistito».
# Era vero, ed è stato vero per tre settimane. Ha smesso di esserlo quando una
# persona ha scaricato il suo Mares Quad Ci e ha scritto «funziona adesso».
#
# *Un commento che afferma un fatto va rimisurato come il fatto.* Questo è il
# giorno in cui si rimisura.
#
# Quello che resta vero: **un modello provato non è una famiglia provata.** Lo
# stesso giorno, dallo stesso programma, un Aqualung i330R si è fermato a metà —
# e il difetto era nostro, nel trasporto, su un pacchetto spezzato dalla radio.
# Il selettore continua a dichiararlo sotto ogni modello che nessuno ha ancora
# acceso — «via libdivecomputer, mai provato su questo modello» — e la frase va
# tolta **un modello per volta**, quando qualcuno lo accende e lo dice. L'elenco
# di quelli provati sta in `src/core/ble/provati.ts`, con la data e da dove
# arriva la notizia.
#
# La protezione che rende accettabile spedirla: in `core/dedupe.ts` un profilo
# arrivato da questa strada NON può sostituire quello di un driver provato sul
# campo. Il danno peggiore possibile è quindi un'immersione nuova sbagliata, che
# si vede e si corregge — non un'immersione giusta sovrascritta in silenzio.
#
# Costo: centoquindici file C prima di ogni build pulita. Chi lavora solo
# sull'interfaccia può ancora saltarli con `--no-default-features`.
default = ["computer-esterni"]

# Accende anche `uuid`, che serve al ponte BLE e a nient'altro, e `cc`, che
# serve a compilare la parte C dove autotools non arriva.
computer-esterni = ["dep:uuid", "dep:cc"]

# ► SPENTA QUASI SEMPRE: serve solo al pacchetto del Mac App Store. ◄
#
# Dentro il negozio ad aggiornare ci pensa Apple, e un programma che si
# sostituisce da sé è motivo di rifiuto — la stessa regola che vale su iPhone.
# Con questa caratteristica accesa il plugin dell'aggiornamento NON viene
# registrato: non è disattivato, non c'è proprio.
#
# ► PERCHÉ UNA CARATTERISTICA E NON UN CONTROLLO A TEMPO DI ESECUZIONE. ◄
# Perché quello che va tolto non è il comportamento, è il CODICE. Un revisore
# che trova nel binario le stringhe di un aggiornatore ha ragione a chiedere
# cosa ci facciano, e la risposta «c'è ma non parte» è la peggiore che si possa
# dare. Così il binario del negozio non contiene niente da spiegare.
#
# Il lato interfaccia si spegne da sé con `VITE_SENZA_AGGIORNAMENTI=1`: le due
# metà si accendono insieme in `scripts/pubblica-mac-negozio.sh`, che è l'unico
# posto da cui questa build si costruisce.
senza-aggiornamenti = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
