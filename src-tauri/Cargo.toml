[package]
name = "mydivelog"
version = "1.6.3"
description = "Logbook subacqueo multi-computer"
authors = ["Matteo Ferrando"]
edition = "2021"
rust-version = "1.77.2"

# Il binario e la libreria: la libreria serve al target iOS, dove Tauri
# compila l'app come libreria statica linkata dal progetto Xcode.
[lib]
name = "mydivelog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Il Bluetooth verso i computer subacquei.
#
# Non ha feature per bersaglio: il crate sceglie da sé CoreBluetooth su Apple,
# BlueZ su Linux, WinRT su Windows. Su una piattaforma dove lo stack non c'è
# `try_init` restituisce un errore invece di far cadere l'applicazione, e il
# lato TypeScript lo dichiara.
tauri-plugin-blec = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Gli UUID dei servizi e delle caratteristiche BLE.
#
# Dipendenza OPZIONALE, accesa solo da `computer-esterni`: serve unicamente al
# ponte verso libdivecomputer, che è l'unico posto del progetto in cui si
# chiamano `send_data` e `subscribe` del plugin — e quelle vogliono un `Uuid`,
# non una stringa. Il plugin non riesporta il tipo, quindi la cassa va nominata
# qui. La versione è la stessa che `tauri-plugin-blec` già si porta dietro, così
# non ne compaiono due copie nel grafo.
uuid = { version = "1", optional = true }

# Aprire un indirizzo nel browser di SISTEMA, non in una finestra nostra.
# Serve all'accesso con Google: una pagina di login disegnata dentro
# l'applicazione è indistinguibile da una finta, perché chi la guarda non può
# vedere né il dominio né il lucchetto.
tauri-plugin-opener = "2"

# Il portachiavi di sistema, solo dove esiste davvero.
#
# Dipendenza per bersaglio e non globale: `keyring` sceglie il backend con le
# feature, e attivare quella di Linux su macOS trascinerebbe dentro dbus e
# secret-service — roba che su un Mac non c'è e che farebbe fallire la build.
# Sugli altri sistemi il modulo non viene compilato affatto e l'interfaccia
# ripiega sull'archivio locale, dichiarandolo.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# L'aggiornamento automatico, e il riavvio che lo conclude. SOLO SU macOS.
#
# Non è una svista che manchi iOS: là gli aggiornamenti li distribuisce l'App
# Store, e un'applicazione che se li scarica per conto suo verrebbe rifiutata
# alla revisione. Dipendenza per bersaglio significa anche che su iPhone questi
# due crate non vengono nemmeno compilati — e che il permesso corrispondente
# deve stare in `capabilities/macos.json`, non in `default.json`, o la build
# iOS fallisce con «permission not found».
#
# `process` serve a una riga sola: dopo aver installato l'aggiornamento
# l'applicazione va riavviata, e senza questo plugin l'unico modo sarebbe
# chiederlo a chi guarda.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Il ritorno dall'accesso su iOS.
#
# Sul Mac si usa un ascoltatore su `127.0.0.1`, che è la strada raccomandata per
# le applicazioni desktop e non lascia in giro nessuna associazione permanente.
# Su iPhone quella porta non si può aprire, quindi il ritorno passa da uno
# schema URL dichiarato in `Info.ios.plist`.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-deep-link = "2"

[features]
# Attivato automaticamente da `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

# ► ACCESA, DAL 25 AGOSTO 2026. ◄
#
# `computer-esterni` entra in ogni build, pacchetti pubblicati compresi. Prima
# era spenta di sua iniziativa, e le ragioni erano due.
#
# LA LICENZA. libdivecomputer è LGPL-2.1: un programma MIT la può usare purché
# chi lo riceve possa ricompilare la libreria e rimetterla al suo posto. Dentro
# un binario firmato da Apple nessuno può rilinkare niente. La posizione che
# regge — e che il manutentore della libreria condivide — è che per
# un'applicazione OPEN SOURCE la condizione è comunque soddisfatta: chi riceve
# il programma può ricostruire *tutto*, libreria compresa, dal sorgente. Perché
# questo resti vero servono due cose, e vanno difese:
#
#   · il sorgente dell'applicazione resta pubblico;
#   · il tarball in `vendor/` resta versionato e resta QUELLO da cui si compila.
#     Sostituirlo con un sottomodulo o con un download in fase di build
#     toglierebbe a chi riceve il binario la possibilità di rifarlo identico, ed
#     è esattamente la proprietà su cui poggia tutto il ragionamento.
#
# ► E QUELLO CHE RESTA VERO ANCHE ORA CHE È ACCESA. ◄
#
# Nessun computer subacqueo di terzi è mai stato collegato a questo codice. Il
# trasporto è provato contro un flusso finto, l'accorpamento dei campioni e la
# traduzione contro immersioni sintetiche, ma il primo apparecchio vero non è
# ancora esistito. Il selettore lo dichiara sotto ogni modello — «via
# libdivecomputer, mai provato su questo modello» — e non è una formula di
# cortesia: è la verità, e va tolta solo quando smette di esserlo.
#
# La protezione che rende accettabile spedirla: in `core/dedupe.ts` un profilo
# arrivato da questa strada NON può sostituire quello di un driver provato sul
# campo. Il danno peggiore possibile è quindi un'immersione nuova sbagliata, che
# si vede e si corregge — non un'immersione giusta sovrascritta in silenzio.
#
# Costo: centoquindici file C prima di ogni build pulita. Chi lavora solo
# sull'interfaccia può ancora saltarli con `--no-default-features`.
default = ["computer-esterni"]

# Accende anche `uuid`, che serve al ponte BLE e a nient'altro.
computer-esterni = ["dep:uuid"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
